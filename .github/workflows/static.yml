name: Publish Hokkaido backup
on:
  push:
    branches: [main]
    paths: [site.zip, guides.zip, .github/workflows/static.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Unpack published itinerary
        run: |
          unzip -q site.zip -d public
          unzip -q guides.zip -d public
          test -s public/index.html
          test -s public/day-6.js
          test -d public/photos/guides
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
